<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorations, Maitreyi Bhardwaj</title>
<meta name="description" content="Smaller things Maitreyi Bhardwaj has tried and built.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css?v=1792993290">
<style>
*, *::before, *::after { box-sizing: border-box; }
/* A white page with blue text: a row of pictures on the left, an index of titles on the right.
   Pointing at a title or a picture lights up its partner. */
body.blue { --ink: #1A36B8; --ink-soft: #4A62C8; --pill: #E8ECFA; background: #fff; color: #1A36B8; -webkit-font-smoothing: antialiased; }
body.blue .topbar a { font-weight: 500; }
body.blue .topbar a:hover, body.blue .topbar a[aria-current="page"] { background: #1A36B8; color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.index { display: grid; grid-template-columns: 2.4fr 1fr; column-gap: clamp(32px, 5vw, 80px); align-items: stretch; padding: 24px var(--gut) 24px; height: calc(100svh - 58px); min-height: 420px; }
/* The pictures fill the height of the window in two rows, so the whole page
   fits one screen. Each picture keeps its own shape and gets a different size. */
.pics { position: relative; min-height: 0; }
.pics a { position: absolute; display: block; transition: opacity .25s ease; }
.pics img { display: block; width: 100%; height: 100%; }
/* the index sits at the bottom right */
.names { align-self: end; }
.names { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.3; }
.names li { margin-bottom: 14px; }
.names li:last-child { margin-bottom: 0; }
.names li.gap { margin-top: 30px; }
.names a, .names span.row { color: #1A36B8; text-decoration: none; transition: color .2s ease; }
.names small { font-size: inherit; opacity: .8; }
.names .on, .names a:hover, .names a:focus-visible { color: #0F2380; font-weight: 600; }
.index.is-pointing .pics a:not(.on) { opacity: .35; }

@media (max-width: 760px) {
  .index { grid-template-columns: 1fr; row-gap: 40px; height: auto; }
  .pics a { position: static; width: auto !important; height: auto !important; margin-bottom: 12px; }
  .pics img { height: auto; }
  .names { align-self: start; }
}
</style>
</head>
<body class="blue">

<div data-topbar></div>

<main class="index" id="index">
  <h1 class="sr-only">Explorations</h1>
  <div class="pics" id="pics"></div>
  <ul class="names" id="names"></ul>
</main>

<div data-foot></div>

<script src="projects.js?v=1792993290"></script>
<script src="site.js?v=1792993290"></script>
<script>
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const wrap = document.getElementById('index'), pics = document.getElementById('pics'), names = document.getElementById('names');
  const link = x => x.href ? ' href="' + esc(x.href) + '" target="_blank" rel="noopener"' : '';
  let lastHadImage = true;
  window.EXPLORATIONS.forEach((x, i) => {
    if (x.image) pics.insertAdjacentHTML('beforeend', '<a data-i="' + i + '"' + link(x) + '><img src="' + esc(x.image) + '" alt="' + esc(x.caption || x.title) + '"></a>');
    const gap = lastHadImage && !x.image ? ' class="gap"' : '';
    lastHadImage = !!x.image;
    const label = esc(x.title) + ' <small>{ ' + esc(x.kind || 'Personal') + ' }</small>';
    names.insertAdjacentHTML('beforeend', '<li' + gap + '>' + (x.href ? '<a data-i="' + i + '"' + link(x) + '>' + label + '</a>' : '<span class="row" data-i="' + i + '">' + label + '</span>') + '</li>');
  });
  // Lay the pictures out in rows of two with the same 12px gap everywhere.
  // In each row one picture is full height and the other smaller, so sizes vary,
  // and everything is scaled to fit the height of the window.
  const GAP = 12, SMALL = [0.62, 0.58];
  function layout() {
    const links = Array.from(pics.children);
    if (matchMedia('(max-width: 760px)').matches) { links.forEach(a => a.removeAttribute('style')); return; }
    const W = pics.clientWidth, H = pics.clientHeight, rows = Math.ceil(links.length / 2);
    const ratio = a => { const im = a.querySelector('img'); return im.naturalWidth ? im.naturalWidth / im.naturalHeight : 1.28; };
    let rowH = (H - GAP * (rows - 1)) / rows;
    // widest row at this height; shrink if it would overflow the column
    const rowW = r => {
      const big = links[r * 2 + (r % 2 ? 1 : 0)], small = links[r * 2 + (r % 2 ? 0 : 1)];
      return rowH * ratio(big) + (small ? GAP + rowH * SMALL[r % 2] * ratio(small) : 0) ;
    };
    let widest = 0; for (let r = 0; r < rows; r++) widest = Math.max(widest, rowW(r));
    if (widest > W) rowH *= W / widest;
    for (let r = 0; r < rows; r++) {
      const y = r * (rowH + GAP), odd = r % 2 === 1;
      const first = links[r * 2], second = links[r * 2 + 1];
      // even rows: large then small (small sits on the row's bottom edge)
      // odd rows: small (on the top edge) then large
      const hFirst = odd ? rowH * SMALL[1] : rowH, hSecond = odd ? rowH : rowH * SMALL[0];
      let x = 0;
      const put = (a, h, top) => { const w = h * ratio(a); a.style.cssText = 'left:' + x + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px'; x += w + GAP; };
      put(first, hFirst, y);
      if (second) put(second, hSecond, odd ? y : y + rowH - hSecond);
    }
  }
  pics.querySelectorAll('img').forEach(im => im.addEventListener('load', layout));
  addEventListener('resize', layout);
  layout();

  const point = i => {
    wrap.classList.toggle('is-pointing', i !== null && !!pics.querySelector('[data-i="' + i + '"]'));
    wrap.querySelectorAll('[data-i]').forEach(el => el.classList.toggle('on', el.dataset.i === String(i)));
  };
  wrap.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('mouseenter', () => point(el.dataset.i));
    el.addEventListener('focus', () => point(el.dataset.i));
    el.addEventListener('mouseleave', () => point(null));
    el.addEventListener('blur', () => point(null));
  });
})();
</script>
</body>
</html>
