<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorations, Maitreyi Bhardwaj</title>
<meta name="description" content="Smaller things Maitreyi Bhardwaj has tried and built.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-font-smoothing: antialiased; overflow-x: clip; }

.opening {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: clamp(110px, 17vw, 340px) var(--gut) clamp(96px, 14vw, 280px);
}
.opening h1, .opening p {
  font-family: var(--f);
  font-size: clamp(28px, 3.5vw, 68px);
  font-weight: 400; line-height: 1.06; letter-spacing: -.025em;
  max-width: 13em; text-wrap: balance;
}
.opening p { color: var(--ink-soft); }

/* a loose board: columns of unequal cards */
.board { padding: 0 var(--gut); columns: 3 260px; column-gap: 6px; }
.tile { display: block; break-inside: avoid; margin-bottom: 28px; color: inherit; text-decoration: none; }
.bar {
  display: flex; justify-content: space-between; gap: 12px;
  font-size: 13px; padding: 7px 12px; border-radius: 8px;
  background: var(--pill); margin-bottom: 6px;
  transition: background .15s, color .15s;
}
a.tile:hover .bar, a.tile:focus-visible .bar { background: var(--ink); color: var(--paper); }
.tile img, .tile video { width: 100%; display: block; border-radius: 4px; margin-bottom: 6px; }
.tile .cap { font-size: 14px; line-height: 1.45; color: var(--ink-soft); margin: 8px 0 0; padding: 0 2px; }
.note { border-radius: 14px; padding: 18px; min-height: 150px; display: flex; align-items: flex-start; }
.tile:nth-child(3n+1) .note { min-height: 220px; }
.note p { font-size: 17px; line-height: 1.3; text-wrap: pretty; }
.note--blue { background: var(--blue); color: #fff; }
.note--brown { background: var(--cocoa); color: #F3ECE4; }
.note--paper { background: var(--pill); color: var(--ink); }

@media (max-width: 640px) { .opening { grid-template-columns: 1fr; gap: 10px; } }
</style>
<link rel="stylesheet" href="site.css?v=1791902380">
</head>
<body>

<div data-topbar></div>

<header class="opening">
  <h1>Explorations.</h1>
  <p>Smaller things I try and build to find out how they work.</p>
</header>

<main class="board" id="board"></main>

<div data-foot></div>

<script src="projects.js?v=1791902380"></script>
<script src="site.js?v=1791902380"></script>
<script>
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('board').innerHTML = window.EXPLORATIONS.map(x => {
    const tag = x.href ? 'a' : 'div';
    const link = x.href ? ' href="' + esc(x.href) + '" target="_blank" rel="noopener"' : '';
    const visual = x.video
      ? '<video muted loop playsinline autoplay src="' + esc(x.video) + '"></video>'
      : x.image ? '<img src="' + esc(x.image) + '" alt="" loading="lazy">' : '';
    return '<' + tag + ' class="tile"' + link + '>' +
      '<div class="bar"><span>' + esc(x.title) + '</span>' + (x.href ? '<span aria-hidden="true">↗</span>' : '') + '</div>' +
      visual +
      (x.caption ? '<p class="cap">' + esc(x.caption) + '</p>' : '') +
      (x.note ? '<div class="note note--' + (x.tone || 'paper') + '"><p>' + esc(x.note) + '</p></div>' : '') +
      '</' + tag + '>';
  }).join('');
})();
</script>
</body>
</html>
