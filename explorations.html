<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorations, Maitreyi Bhardwaj</title>
<meta name="description" content="A space to wander through Maitreyi Bhardwaj's explorations: photography, animation, craft, models and code.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css?v=1793039215">
<style>
/* A white 3D space. Pieces float at different depths; scrolling moves you through them,
   the mouse tilts the view, and clicking a piece opens it with a short description. */
html, body { height: 100%; }
body.space { background: #fff; overflow: hidden; overscroll-behavior: none; }
body.space > nav.topbar { position: fixed !important; top: 0; left: 0; right: 0; z-index: 20 !important; }
.stage { position: fixed; inset: 0; perspective: 1300px; perspective-origin: 50% 50%; overflow: hidden; cursor: grab; touch-action: none; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.piece { position: absolute; left: 0; top: 0; transform-style: preserve-3d; cursor: pointer; will-change: transform, opacity;
  background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; }
.piece img, .piece video { display: block; width: 100%; height: auto; background: #F3F1EE; box-shadow: 0 30px 60px -36px rgba(40, 20, 30, .35); }
.piece .note { width: 100%; aspect-ratio: 4 / 3; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
  background: #F7E6EE; color: #5A2840; font-size: 15px; line-height: 1.35; }
.piece .note small { font-size: 12px; opacity: .7; }
.piece .cap { position: absolute; left: 0; top: 100%; margin-top: 8px; font-size: 12px; white-space: nowrap; color: #2B1B11;
  opacity: 0; transition: opacity .25s ease; }
.piece .cap span { color: #9A8A80; margin-left: 6px; }
.piece:hover .cap, .piece:focus-visible .cap { opacity: 1; }
.piece:focus-visible { outline: 2px solid #CF6B9B; outline-offset: 4px; }

.hint { position: fixed; left: var(--gut); bottom: 22px; z-index: 5; font-size: 13px; color: #8C827B; pointer-events: none; }
.count { position: fixed; right: var(--gut); bottom: 22px; z-index: 5; font-size: 13px; color: #8C827B; font-variant-numeric: tabular-nums; }

/* the open piece */
.panel { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow-y: auto; padding: clamp(70px, 9vh, 100px) var(--gut) clamp(28px, 5vh, 48px);
  background: radial-gradient(120% 90% at 70% 80%, rgba(196, 176, 150, .55), rgba(22, 20, 18, .88) 60%); backdrop-filter: blur(16px);
  opacity: 0; pointer-events: none; transition: opacity .4s ease; cursor: zoom-out; }
.panel.on { opacity: 1; pointer-events: auto; }
/* the sheet: a white card with a thin pink edge. Picture on the left; on the right, sections
   stacked one under another, each a label over a fine rule with the text beneath, set in the
   home page's type (Inter, 15px). */
.sheet { position: relative; display: flex; align-items: stretch; cursor: default; max-width: min(1180px, 100%); max-height: 100%;
  background: #fff; padding: 22px; border: 1px solid #E59BBE; box-shadow: 0 60px 120px -50px rgba(0, 0, 0, .7);
  transform: translateY(14px); transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.panel.on .sheet { transform: none; }
.sheet-pic { display: flex; flex-direction: column; gap: 10px; flex: none; }
.sheet-pic .shot { position: relative; line-height: 0; background: #1a1714; cursor: pointer; }
.sheet-pic img, .sheet-pic video { display: block; height: min(72vh, 720px); width: auto; max-width: 52vw; object-fit: cover; }
.sheet.land .sheet-pic img, .sheet.land .sheet-pic video { height: auto; width: min(54vw, 740px); max-width: none; max-height: 72vh; }
.sheet-dots { display: flex; gap: 7px; padding: 0 1px; }
.sheet-dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; border: 1px solid #2B2621; background: transparent; cursor: pointer; }
.sheet-dots button[aria-current="true"] { background: #2B2621; }
.sheet-text { width: clamp(260px, 26vw, 360px); padding: 8px 8px 0 40px; display: flex; flex-direction: column; font-family: var(--f); color: #111; }
#psecs { display: flex; flex-direction: column; gap: 44px; }
.sheet-text h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; color: #111; }
.sheet-text h3::after { content: ''; display: block; height: 1px; background: #111; opacity: .6; margin: 10px 0 14px; }
.sheet-text p { margin: 0; font-size: 15px; line-height: 1.45; color: #111; }
.sheet-text p.empty { color: #9A938C; }
.sheet-text .foot { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 24px; font-size: 15px; line-height: 1.45; }
.sheet-text .foot button, .sheet-text .foot a { font: inherit; color: #111; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; border-bottom: 1px solid currentColor; margin-left: 18px; }
.panel .close { position: absolute; top: clamp(66px, 8vh, 84px); right: var(--gut); width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
@media (max-width: 760px) {
  .panel { place-items: start center; }
  .sheet { flex-direction: column; width: 100%; }
  .sheet-pic img, .sheet-pic video, .sheet.land .sheet-pic img, .sheet.land .sheet-pic video { width: 100%; height: auto; max-width: none; max-height: 60svh; }
  .sheet-text { width: auto; padding: 24px 4px 0; }
  #psecs { gap: 28px; }
}
.piece .many { position: absolute; top: 6px; right: 6px; min-width: 20px; padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,.9); font-size: 11px; color: #2B1B11; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body class="space">

<div data-topbar></div>
<h1 class="sr-only">Explorations</h1>

<div class="stage" id="stage"><div class="world" id="world"></div></div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Exploration">
  <button class="close" id="pclose" aria-label="Close">&times;</button>
  <article class="sheet" id="sheet">
    <div class="sheet-pic"><div class="shot" id="pshot"></div><div class="sheet-dots" id="pdots"></div></div>
    <div class="sheet-text">
      <div id="psecs"></div>
      <div class="foot"><a id="popen" href="#">See the project</a><button id="pnext">Next &rarr;</button></div>
    </div>
  </article>
</div>

<script src="space-data.js?v=1793039215"></script>
<script src="site.js?v=1793039215"></script>
<script>
(function () {
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const items = window.SPACE || [];
  const stage = document.getElementById('stage'), world = document.getElementById('world');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // a seeded random, so the layout is the same on every visit
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const GAP = 460;                          // depth between one piece and the next
  const LEN = Math.max(items.length, 1) * GAP; // the space loops after this
  const pieces = items.map((it, i) => {
    const b = document.createElement('button');
    b.className = 'piece'; b.type = 'button';
    b.setAttribute('aria-label', it.title + (it.kind ? ', ' + it.kind : ''));
    const w = Math.round(190 + rnd() * 140);
    b.style.width = w + 'px';
    if (it.images && !it.image) it.image = it.images[0];
    const media = it.video
      ? '<video data-src="' + esc(it.video) + '" muted loop playsinline preload="none"' + (it.image ? ' poster="' + esc(it.image) + '"' : '') + '></video>'
      : it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" decoding="async">'
      : '<div class="note"><span>' + esc(it.text) + '</span><small>' + esc(it.kind) + '</small></div>';
    b.innerHTML = media;
    world.appendChild(b);
    // spread across the view, keeping the very centre a little clearer
    let x, y;
    do { x = (rnd() * 2 - 1); y = (rnd() * 2 - 1); } while (Math.abs(x) < .18 && Math.abs(y) < .18);
    const p = { el: b, it, i, w, x, y, z0: -i * GAP - rnd() * GAP * .5, vid: b.querySelector('video') };
    b.addEventListener('click', () => { if (!moved) open(i); });
    return p;
  });

  // camera: z moves through the space, the mouse tilts it
  let z = 0, vz = still ? 0 : 0.35, target = 0, mx = 0, my = 0, tx = 0, ty = 0, W = innerWidth, H = innerHeight;
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; });
  stage.addEventListener('wheel', e => { e.preventDefault(); target += e.deltaY * 1.2; }, { passive: false });
  addEventListener('keydown', e => {
    if (panel.classList.contains('on')) { if (e.key === 'Escape') close(); return; }
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') target += 400;
    if (e.key === 'ArrowUp' || e.key === 'PageUp') target -= 400;
  });
  addEventListener('pointermove', e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; }, { passive: true });

  // drag (and touch) to move: up/down moves through, sideways pans
  let down = null, moved = false, panX = 0, panY = 0, pX = 0, pY = 0;
  stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, px: pX, py: pY, t: target }; moved = false; });
  addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) > 6) { moved = true; stage.classList.add('dragging'); }
    target = down.t - dy * 3; pX = down.px + dx * .8;
  });
  addEventListener('pointerup', () => { down = null; stage.classList.remove('dragging'); setTimeout(() => { moved = false; }, 0); });

  const wrap = v => ((v % LEN) + LEN) % LEN;
  function frame() {
    if (!panel.classList.contains('on')) {
      target += vz; // a slow drift forward, so the space always feels alive
      z += (target - z) * .08;
      tx += (mx - tx) * .05; ty += (my - ty) * .05;
      panX += (pX - panX) * .1;
    }
    world.style.transform = 'rotateY(' + (tx * 8) + 'deg) rotateX(' + (-ty * 6) + 'deg) translateX(' + panX + 'px)';
    let nearest = null, nd = 1e9;
    for (const p of pieces) {
      // depth relative to the camera, looped so the space never ends
      let d = wrap(p.z0 + z + 260) - LEN + 260;   // from -LEN+260 (far) to 260 (just passed)
      const far = -LEN + 260;
      const fadeIn = Math.min(1, (d - far) / 700);       // emerge from the white
      const fadeOut = d > 0 ? Math.max(0, 1 - d / 260) : 1; // dissolve as it passes you
      const op = Math.max(0, Math.min(fadeIn, fadeOut));
      // spread grows with distance so far pieces still reach the edges of the screen
      const spread = 1 + Math.max(0, -d) / 900 * .85;
      const sx = p.x * (W * .46) * spread, sy = p.y * (H * .40) * spread;
      const grow = 1 + Math.max(0, -d) / 1600 * .35;   // far pieces are drawn a little larger so they never shrink to specks
      p.el.style.transform = 'translate3d(' + (sx - p.w / 2) + 'px,' + (sy - p.w * .4) + 'px,' + d + 'px) scale(' + grow.toFixed(3) + ')';
      p.el.style.opacity = op.toFixed(3);
      p.el.style.visibility = op < .02 ? 'hidden' : 'visible';
      p.el.style.pointerEvents = op < .3 ? 'none' : 'auto';
      if (p.vid) {
        const near = op > .15 && d > -1800;
        if (op > .02 && !p.vid.src) { p.vid.preload = 'auto'; p.vid.src = p.vid.dataset.src; }
        if (near && p.vid.paused) p.vid.play().catch(() => {});
        if (!near && !p.vid.paused) p.vid.pause();
      }
      if (d < 0 && -d < nd) { nd = -d; nearest = p; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // the open piece
  const panel = document.getElementById('panel');
  let current = -1, lastFocus = null;
  // Every picture of a piece, plus the pictures of any other piece from the same project,
  // become one set of slides with dots.
  const slidesFor = it => {
    const own = (it.images || [it.image || null]).map(s => typeof s === 'string' || s === null ? { src: s } : s)
      .map(s => ({ src: s.src, video: s.src === it.image || !s.src ? it.video : null, text: s.text || '' }));
    if (!own[0].src && !own[0].video) own[0] = { note: it.text };
    if (it.href && !/^https?:/.test(it.href)) items.forEach(o => {
      if (o === it || o.href !== it.href) return;
      (o.images || [o.image]).forEach(s => { if (s || o.video) own.push({ src: typeof s === 'string' ? s : s && s.src, video: o.video && (!s || s === o.image) ? o.video : null, text: o.title + '. ' + (o.text || '') }); });
    });
    return own;
  };
  const shot = document.getElementById('pshot'), dots = document.getElementById('pdots'), sheet = document.getElementById('sheet');
  let slides = [], at = 0;
  // landscape pictures get a wider column, portrait ones stand tall
  const orient = el => { const w = el.naturalWidth || el.videoWidth, hh = el.naturalHeight || el.videoHeight; if (w) sheet.classList.toggle('land', w > hh * 1.08); };
  function show(k) {
    at = (k + slides.length) % slides.length;
    const s = slides[at];
    shot.innerHTML = s.video ? '<video src="' + esc(s.video) + '"' + (s.src ? ' poster="' + esc(s.src) + '"' : '') + ' autoplay muted loop playsinline></video>'
      : '<img src="' + esc(s.src) + '" alt="' + esc(items[current].title) + ', ' + (at + 1) + ' of ' + slides.length + '">';
    const m = shot.firstChild;
    if (m.tagName === 'IMG') { if (m.complete) orient(m); else m.onload = () => orient(m); } else m.onloadedmetadata = () => orient(m);
    dots.querySelectorAll('button').forEach((b, n) => b.setAttribute('aria-current', String(n === at)));
  }
  shot.addEventListener('click', () => { if (slides.length > 1) show(at + 1); });   // click the picture for the next one
  dots.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.n); });
  const section = (label, text) => '<section><h3>' + label + '</h3>' + (text ? '<p>' + esc(text) + '</p>' : '<p class="empty">To be added.</p>') + '</section>';
  function open(i) {
    const it = items[i]; current = i; lastFocus = document.activeElement;
    slides = slidesFor(it).filter(s => s.src || s.video);
    dots.innerHTML = slides.length > 1 ? slides.map((_, n) => '<button data-n="' + n + '" aria-label="Picture ' + (n + 1) + '"></button>').join('') : '';
    sheet.classList.remove('land');
    show(0);
    document.getElementById('psecs').innerHTML = section(it.title, it.text) + section('The place', it.place) + section('The story', it.story);
    const a = document.getElementById('popen');
    if (it.href) { a.hidden = false; a.href = it.href; const ext = /^https?:/.test(it.href); a.target = ext ? '_blank' : ''; a.rel = ext ? 'noopener' : ''; }
    else a.hidden = true;
    panel.classList.add('on');
  }
  addEventListener('keydown', e => {
    if (!panel.classList.contains('on') || slides.length < 2) return;
    if (e.key === 'ArrowRight') show(at + 1); if (e.key === 'ArrowLeft') show(at - 1);
  });
  // swipe between pictures on touch screens
  let sx = null;
  shot.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  shot.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); sx = null; });
  function close() { panel.classList.remove('on'); shot.innerHTML = ''; if (lastFocus && lastFocus.blur) lastFocus.blur(); }
  document.getElementById('pclose').addEventListener('click', close);
  // clicking the background (anything that isn't the picture, the dots or the card) goes back to the space
  panel.addEventListener('click', e => { if (!e.target.closest('.sheet')) close(); });
  document.getElementById('pnext').addEventListener('click', () => {
    open((current + 1) % items.length);
  });
})();
</script>
</body>
</html>
