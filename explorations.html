<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorations, Maitreyi Bhardwaj</title>
<meta name="description" content="Smaller things Maitreyi Bhardwaj has tried and built.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css?v=1791903171">
<style>
*, *::before, *::after { box-sizing: border-box; }
/* A fully maroon page: a row of pictures on the left, an index of titles on the right.
   Pointing at a title or a picture lights up its partner. */
html:has(body.maroon) { background: #6B1620; }
body.maroon { --paper: #6B1620; --ink: #FFFFFF; --ink-soft: #F0D9DB; --pill: rgba(255, 255, 255, .14); background: var(--paper); color: #fff; -webkit-font-smoothing: antialiased; }
body.maroon .topbar a { font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.index { display: grid; grid-template-columns: 2.4fr 1fr; column-gap: clamp(32px, 5vw, 80px); align-items: stretch; padding: 24px var(--gut) 24px; height: calc(100svh - 58px); min-height: 420px; }
/* The pictures fill the height of the window in two rows, so the whole page
   fits one screen. Each picture keeps its own shape and gets a different size. */
.pics { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: 1.15fr 1fr; gap: 12px; min-height: 0; }
.pics a { display: flex; min-width: 0; min-height: 0; align-items: flex-end; justify-content: flex-start; transition: opacity .25s ease; }
.pics img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.pics a:nth-child(4n+1) { grid-column: span 7; }
.pics a:nth-child(4n+2) { grid-column: span 5; }
.pics a:nth-child(4n+2) img { max-height: 62%; }
.pics a:nth-child(4n+3) { grid-column: span 4; align-items: flex-start; justify-content: flex-end; }
.pics a:nth-child(4n+3) img { max-height: 58%; }
.pics a:nth-child(4n+4) { grid-column: span 8; align-items: flex-start; }
/* the index sits at the bottom right */
.names { align-self: end; }
.names { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.3; }
.names li { margin-bottom: 14px; }
.names li:last-child { margin-bottom: 0; }
.names li.gap { margin-top: 30px; }
.names a, .names span.row { color: #F0D9DB; text-decoration: none; transition: color .2s ease; }
.names small { font-size: inherit; opacity: .8; }
.names .on, .names a:hover, .names a:focus-visible { color: #fff; font-weight: 600; }
.index.is-pointing .pics a:not(.on) { opacity: .35; }

@media (max-width: 760px) {
  .index { grid-template-columns: 1fr; row-gap: 40px; height: auto; }
  .pics { display: block; }
  .pics a { display: block; margin-bottom: 12px; }
  .pics a:nth-child(n) img { max-height: none; width: 100%; }
  .names { align-self: start; }
}
</style>
</head>
<body class="maroon">

<div data-topbar></div>

<main class="index" id="index">
  <h1 class="sr-only">Explorations</h1>
  <div class="pics" id="pics"></div>
  <ul class="names" id="names"></ul>
</main>

<div data-foot></div>

<script src="projects.js?v=1791903171"></script>
<script src="site.js?v=1791903171"></script>
<script>
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const wrap = document.getElementById('index'), pics = document.getElementById('pics'), names = document.getElementById('names');
  const link = x => x.href ? ' href="' + esc(x.href) + '" target="_blank" rel="noopener"' : '';
  let lastHadImage = true;
  window.EXPLORATIONS.forEach((x, i) => {
    if (x.image) pics.insertAdjacentHTML('beforeend', '<a data-i="' + i + '"' + link(x) + '><img src="' + esc(x.image) + '" alt="' + esc(x.caption || x.title) + '"></a>');
    const gap = lastHadImage && !x.image ? ' class="gap"' : '';
    lastHadImage = !!x.image;
    const label = esc(x.title) + ' <small>{ ' + esc(x.kind || 'Personal') + ' }</small>';
    names.insertAdjacentHTML('beforeend', '<li' + gap + '>' + (x.href ? '<a data-i="' + i + '"' + link(x) + '>' + label + '</a>' : '<span class="row" data-i="' + i + '">' + label + '</span>') + '</li>');
  });
  const point = i => {
    wrap.classList.toggle('is-pointing', i !== null && !!pics.querySelector('[data-i="' + i + '"]'));
    wrap.querySelectorAll('[data-i]').forEach(el => el.classList.toggle('on', el.dataset.i === String(i)));
  };
  wrap.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('mouseenter', () => point(el.dataset.i));
    el.addEventListener('focus', () => point(el.dataset.i));
    el.addEventListener('mouseleave', () => point(null));
    el.addEventListener('blur', () => point(null));
  });
})();
</script>
</body>
</html>
