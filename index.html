<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maitreyi Bhardwaj, design and creative engineering</title>
<meta name="description" content="Maitreyi Bhardwaj designs interfaces and design systems and builds with data and code. A timeline of projects, newest first.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-font-smoothing: antialiased; overflow-x: clip; }

.opening {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: clamp(110px, 17vw, 340px) var(--gut) clamp(96px, 14vw, 280px);
}
.opening h1, .opening p {
  font-family: var(--f);
  font-size: clamp(28px, 3.5vw, 68px);
  font-weight: 400; line-height: 1.06; letter-spacing: -.025em;
  max-width: 13em; text-wrap: balance;
}
.opening p { color: var(--ink-soft); }
/* the opening line types itself out; every letter keeps its place from the start */
#say .say-blue { color: var(--blue); }
#say .say-brown { color: #8A5A3C; display: block; margin-top: .55em; }
/* Creative Engineering starts on the same line as the Work pill above it */
.opening p { align-self: start; }
#say .say-name.struck { text-decoration: line-through; text-decoration-thickness: .07em; color: #D33A2C; }
#say .say-name.oops { color: #E0A800; }
#say .say-pron { font-size: .46em; letter-spacing: 0; color: var(--ink-soft); margin-left: .5em; vertical-align: .32em; white-space: nowrap; opacity: 0; transition: opacity .6s ease; }
#say .say-pron.on { opacity: 1; }
#say .ch { opacity: 0; }
#say .ch.on { opacity: 1; }
#say .caret { position: relative; }
#say .caret::after {
  content: ''; position: absolute; left: .04em; top: .12em; bottom: .1em; width: .06em;
  background: var(--blue); animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- timeline ---------- */
.feed { padding: 0 var(--gut); }
.row {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px;
  margin-bottom: clamp(80px, 11vw, 200px);
  align-items: start;
}
.date {
  font-size: 13px; padding: 7px 12px; border-radius: 8px;
  background: var(--pill); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.cards { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }

.card { display: block; color: inherit; text-decoration: none; min-width: 0; }
.card--l { flex: 0 1 min(100%, 760px); }  /* a wide card never fills the whole row */
.card--m { flex: 1 1 240px; }
.card--s { flex: 0 1 300px; }

.bar {
  display: flex; justify-content: space-between; gap: 12px;
  font-size: 13px; padding: 7px 12px; border-radius: 8px;
  background: var(--pill); margin-bottom: 6px;
  transition: background .15s, color .15s;
}
a.card:hover .bar, a.card:focus-visible .bar { background: var(--ink); color: var(--paper); }

/* the visual sits in front; the type is behind it */
.media { position: relative; overflow: hidden; border-radius: 4px; background: #1A36B8; }  /* the same blue as the About page */
.card--l .media { aspect-ratio: 1.9; }
.card--m .media { aspect-ratio: 1; }
.behind {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  padding: clamp(16px, 1.8vw, 28px);
  color: #fff;
}
.behind p { font-size: clamp(14px, 1.25vw, 19px); line-height: 1.35; letter-spacing: -.005em; max-width: 34em; text-wrap: pretty; }
.card--m .behind p { font-size: 14px; }
.behind dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.behind dt { color: #D8E0FC; }
.behind p { font-weight: 500; }
.front {
  position: absolute; inset: 0;
  clip-path: inset(0 0 0 0);
  transition: clip-path .55s cubic-bezier(.7, 0, .2, 1);
  background: var(--pill);
}
.front img, .front video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover { height: 100%; background: var(--cocoa); color: #F3ECE4; padding: clamp(16px, 2.4vw, 40px); display: flex; gap: clamp(16px, 3vw, 48px); align-items: stretch; }
.cover-words { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
.cover strong { font-family: var(--f); font-weight: 400; font-size: clamp(40px, 7vw, 112px); letter-spacing: -.04em; line-height: .9; }
.cover span { font-size: clamp(14px, 1.3vw, 19px); line-height: 1.35; color: #D9CBBD; max-width: 22em; }
.cover .dots { height: 100%; flex: none; }
.cover--blue { background: var(--blue); color: #fff; }
.cover--blue span { color: #DCE5FB; }
.card--m .cover strong { font-size: clamp(40px, 5vw, 80px); }
.card--m .cover span { font-size: 14px; }
.front--blur img { filter: blur(14px); transform: scale(1.12); }
.front--blur::after {
  content: 'Under NDA'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(36, 22, 13, .34); color: #fff; font-size: 15px;
}
.card:hover .front, .card:focus-visible .front, .card:focus-within .front, .card.is-open .front { clip-path: inset(0 0 100% 0); }

/* a tool mark that fills the space under a shorter card */
.card--stretch { align-self: stretch; display: flex; flex-direction: column; }
.badge {
  flex: 1; min-height: 84px; margin-top: 6px; border-radius: 4px; background: var(--pill);
  display: flex; align-items: flex-end; justify-content: flex-start; padding: 18px;
}
.badge svg { width: 34px; height: 34px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* text-only cards */
.note {
  border-radius: 14px; padding: 18px 18px 16px;
  min-height: 190px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 28px;
}
.note p { font-size: 17px; line-height: 1.3; letter-spacing: -.005em; text-wrap: pretty; }
.note small { font-size: 13px; opacity: .72; }
.note--blue { background: var(--blue); color: #fff; }
.note--brown { background: var(--cocoa); color: #F3ECE4; }
.note--paper { background: var(--pill); color: var(--ink); }

@media (max-width: 640px) {
  .opening { grid-template-columns: 1fr; gap: 10px; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .date { justify-self: start; }
  .card--l, .card--m, .card--s { flex: 1 1 100%; }
  .card--l .media { aspect-ratio: 1.25; }
}
@media (prefers-reduced-motion: reduce) { .front { transition: none; } }

/* ---------- opening: on the moving lace shader (lace.js) ---------- */
.opening {
  position: relative; isolation: isolate; overflow: hidden;
  margin: 20px var(--gut) clamp(80px, 11vw, 200px); border-radius: 4px;
  padding: clamp(96px, 14vw, 280px) clamp(20px, 3vw, 48px) clamp(96px, 13vw, 250px);
  background: #C862B8; color: #fff;
}
.opening canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
.opening::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(100deg, rgba(38, 20, 44, .66) 0%, rgba(38, 20, 44, .42) 55%, rgba(38, 20, 44, .16) 100%); }
.opening h1, .opening p { text-shadow: 0 1px 14px rgba(38, 20, 44, .9); }
.opening p { color: #E9E4DA; }
#say { color: #fff; }
#say .say-blue { color: #FFC896; }
#say .say-brown { color: #F4F1EA; }
#say .say-name.struck { color: #FFA493; }
#say .say-name.oops { color: #FFD866; }
#say .say-pron { color: #E9E4DA; }
#say .caret::after { background: #FFC896; }

/* field switch, at the bottom of the intro */
.fields { position: absolute; left: clamp(20px, 3vw, 48px); bottom: clamp(20px, 3vw, 40px); display: flex; gap: 6px; flex-wrap: wrap; }
.fields button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 100px; border: 1px solid rgba(255, 255, 255, .55); background: rgba(38, 20, 44, .35); color: #fff; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.fields button:hover { background: rgba(255, 255, 255, .18); }
.fields button[aria-pressed="true"] { background: #fff; color: #2B1B11; border-color: #fff; }
.fields button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#work .row[hidden], #work .card[hidden] { display: none; }
/* light version of the intro (industrial design) */
.opening { transition: background-color .6s ease; }
.opening::after { transition: opacity .6s ease; }
.opening.is-light { background: #FBF8F4; }
.opening.is-light::after { opacity: 0; }
.opening.is-light h1, .opening.is-light p { text-shadow: none; }
.opening.is-light p { color: #7C6C60; }
.opening.is-light #say { color: #2B1B11; }
.opening.is-light #say .say-blue { color: #1A36B8; }
.opening.is-light #say .say-brown { color: #8A5A3C; }
.opening.is-light #say .say-pron { color: #7C6C60; }
.opening.is-light .fields button { border-color: #CFC6BC; background: rgba(255, 255, 255, .6); color: #2B1B11; }
.opening.is-light .fields button[aria-pressed="true"] { background: #2B1B11; color: #fff; border-color: #2B1B11; }
</style>

<body>

<div data-topbar></div>

<header class="opening">
  <canvas data-lace aria-hidden="true"></canvas>
  <h1 id="say">Hi, I'm Maitreyi (my·TRAY·ee). I build products by connecting design, data, and technology.</h1>
  <p>Creative Engineering.</p>
  <div class="fields" role="group" aria-label="Show work by field">
    <button type="button" data-field="all" aria-pressed="true">All work</button>
    <button type="button" data-field="ux" aria-pressed="false">UI/UX</button>
    <button type="button" data-field="id" aria-pressed="false">Industrial design</button>
  </div>
</header>

<main class="feed" id="work"></main>

<div data-foot></div>

<script src="projects.js?v=1792587960"></script>
<script src="lace.js?v=1792587960"></script>
<script src="site.js?v=1792587960"></script>
<script>
// The opening line, typed out as if Maitreyi is writing it. The name takes three
// tries: two spellings people get wrong are typed, crossed out in red and erased,
// then a yellow "oops", then the right one stays with how to say it.
(function () {
  const TRIES = ['Mytree', 'Maitri'];
  const NAME = 'Maitreyi';
  const AFTER = 'I build products by connecting design, data, and technology.';
  const h1 = document.getElementById('say');
  h1.setAttribute('aria-label', "Hi, I'm Maitreyi, pronounced my-TRAY-ee. " + AFTER);
  h1.textContent = '';

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; n.setAttribute('aria-hidden', 'true'); return n; };
  // letters that are laid out from the start and only made visible, so nothing below shifts
  const letters = (parent, text) => {
    const out = [];
    text.split(' ').forEach((tok, i) => {
      if (i) parent.appendChild(document.createTextNode(' '));
      const word = el('span'); word.style.whiteSpace = 'nowrap'; parent.appendChild(word);
      for (const c of tok) { const s = el('span', 'ch', c); word.appendChild(s); out.push(s); }
    });
    return out;
  };

  const hi = el('span');           const hiSteps = letters(hi, "Hi, I'm");
  const name = el('span', 'say-blue say-name');
  const pron = el('span', 'say-pron', '(my\u00b7TRAY\u00b7ee) :)');
  const rest = el('span', 'say-brown'); const restSteps = letters(rest, AFTER);
  h1.append(hi, ' ', name, pron, rest);

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    [...hiSteps, ...restSteps].forEach(s => s.classList.add('on'));
    name.textContent = NAME;
    return;
  }

  const caret = el('span', 'caret');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const pace = () => 40 + Math.random() * 50;
  async function reveal(steps) {
    for (const s of steps) { s.classList.add('on'); s.after(caret); await wait(/[.,]/.test(s.textContent) ? 320 : pace()); }
  }
  async function typeName(word) {
    for (const c of word) { name.textContent += c; name.after(caret); await wait(pace() + 25); }
  }
  async function crossOut() {
    await wait(450);
    name.classList.add('struck');
    await wait(750);
    while (name.textContent) { name.textContent = name.textContent.slice(0, -1); await wait(28); }
    name.classList.remove('struck');
    await wait(220);
  }
  (async function () {
    await reveal(hiSteps);
    for (const t of TRIES) { await typeName(t); await crossOut(); }
    // a yellow "oops", then the right spelling
    name.classList.add('oops');
    await typeName('oops');
    await wait(650);
    while (name.textContent) { name.textContent = name.textContent.slice(0, -1); await wait(40); }
    name.classList.remove('oops');
    await wait(200);
    await typeName(NAME);
    await wait(250);
    pron.classList.add('on');
    await wait(700);
    await reveal(restSteps);
    setTimeout(() => caret.remove(), 2400);
    // the pronunciation is a passing note: it fades away once the sentence has finished typing
    setTimeout(() => pron.classList.remove('on'), 500);
  })();
})();

// Build the timeline from projects.js
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const external = h => /^https?:/.test(h);

  // tool marks that can sit under a card
  const BADGES = {
    powerbi: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="26" width="10" height="16" rx="2.5" fill="#D99E0B"/><rect x="19" y="16" width="10" height="26" rx="2.5" fill="#E8B50F"/><rect x="32" y="6" width="10" height="36" rx="2.5" fill="#F2C811"/></svg><span class="sr">Built in Power BI</span>'
  };

  function card(c) {
    const tag = c.href ? 'a' : 'div';
    const link = c.href ? ' href="' + esc(c.href) + '"' + (external(c.href) ? ' target="_blank" rel="noopener"' : '') : '';
    const arrow = c.href ? '<span aria-hidden="true">' + (external(c.href) ? '↗' : '→') + '</span>' : '';
    let inner;
    if (c.note) {
      inner = '<div class="note note--' + (c.tone || 'paper') + '"><p>' + esc(c.note) + '</p>' +
        (c.cta ? '<small>' + esc(c.cta) + '</small>' : '') + '</div>';
    } else {
      const visual = c.video
        ? '<video muted loop playsinline preload="none" poster="' + esc(c.image || '') + '" src="' + esc(c.video) + '"></video>'
        : c.image ? '<img src="' + esc(c.image) + '" alt="" loading="lazy"' + (c.focus ? ' style="object-position:' + esc(c.focus) + '"' : '') + '>'
        : '<div class="cover' + (c.tone === 'blue' ? ' cover--blue' : '') + '"><div class="cover-words"><strong>' + esc(c.cover || c.title) + '</strong><span>' + esc(c.coverNote || '') + '</span></div>' +
          (c.dots ? window.mbDots(c.dots[0], c.dots[1]) : '') + '</div>';
      inner = '<div class="media"' + (c.ratio ? ' style="aspect-ratio:' + Number(c.ratio) + '"' : '') + '>' +
        '<div class="behind"><p>' + esc(c.about) + '</p>' +
        '<dl><dt>Role</dt><dd>' + esc(c.role) + '</dd><dt>Tools</dt><dd>' + esc(c.tools) + '</dd></dl></div>' +
        '<div class="front' + (c.blur ? ' front--blur' : '') + '">' + visual + '</div>' +
        '</div>';
    }
    if (c.badge && BADGES[c.badge]) inner += '<div class="badge">' + BADGES[c.badge] + '</div>';
    const focusable = !c.href && !c.note ? ' tabindex="0"' : '';
    // which field the card belongs to: industrial design pages, everything else UI/UX, notes in both
    const field = c.field || (c.note ? 'all' : /(strata|kith|pitboss)\.html/.test(c.href || '') ? 'id' : 'ux');
    return '<' + tag + ' class="card card--' + (c.size || 'm') + (c.badge ? ' card--stretch' : '') + '" data-field="' + field + '"' + link + focusable + '>' +
      '<div class="bar"><span>' + esc(c.title) + '</span>' + arrow + '</div>' + inner + '</' + tag + '>';
  }

  document.getElementById('work').innerHTML = window.TIMELINE.map(r =>
    '<section class="row"><div class="date">' + esc(r.date) + '</div>' +
    '<div class="cards">' + r.cards.map(card).join('') + '</div></section>').join('');

  // The field switch in the intro: filters the timeline, and changes the intro background
  // (all and UI/UX: the pink lace; industrial design: the light, mouse-moved version).
  (function () {
    const intro = document.querySelector('.opening'), lace = intro.querySelector('canvas[data-lace]');
    const buttons = intro.querySelectorAll('.fields button');
    const show = f => {
      buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.field === f)));
      document.querySelectorAll('#work .card').forEach(c => { c.hidden = !(f === 'all' || c.dataset.field === 'all' || c.dataset.field === f); });
      document.querySelectorAll('#work .row').forEach(r => { r.hidden = !r.querySelector('.card:not([hidden])'); });
      intro.classList.toggle('is-light', f === 'id');
      if (lace && lace.setMode) lace.setMode(f === 'id' ? 'light' : 'dark');
    };
    buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.field)));
  })();

  // Touch screens have no hover: the first tap shows the type, the second follows the link.
  if (matchMedia('(hover: none)').matches) {
    document.querySelectorAll('.card').forEach(el => {
      if (!el.querySelector('.media')) return;
      el.addEventListener('click', e => {
        if (el.classList.contains('is-open')) return;
        e.preventDefault();
        document.querySelectorAll('.card.is-open').forEach(o => o.classList.remove('is-open'));
        el.classList.add('is-open');
      });
    });
  }

  // Screen recordings play while they are on screen.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const io = new IntersectionObserver(en => en.forEach(x => x.isIntersecting ? x.target.play().catch(() => {}) : x.target.pause()), { threshold: .4 });
    document.querySelectorAll('.front video').forEach(v => io.observe(v));
  }
})();
</script>
</body>
